<div id="app">
  <aside id="sidebar" aria-label="Chats">
    <div class="side-top">
      <button id="newChat" class="side-btn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-new"/></svg><span>New chat</span></button>
      <div class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input id="chatSearch" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats" /></div>
    </div>
    <nav id="chatList"></nav>
    <div class="side-bottom">
      <button id="openSettings" class="side-btn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span></button>
    </div>
  </aside>
  <div id="scrim" class="hidden"></div>

  <main>
    <header>
      <button id="toggleSidebar" class="icon" type="button" aria-label="Open chats" title="Chats"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <button id="modelBtn" class="model-btn" type="button" aria-haspopup="dialog">
        <span id="modelName">Model</span><span id="modelBadges" class="badges"></span><svg class="ic chev" aria-hidden="true"><use href="#i-chev"/></svg>
      </button>
      <button id="newChatTop" class="icon" type="button" aria-label="New chat" title="New chat"><svg class="ic" aria-hidden="true"><use href="#i-new"/></svg></button>
    </header>

    <section id="messages" aria-live="polite"></section>

    <div id="composerWrap">
      <div id="attachments" class="hidden"></div>
      <div id="imgOpts" class="hidden">
        <label>Aspect ratio <select id="aspect">
          <option value="">default</option><option>1:1</option><option>2:3</option><option>3:2</option><option>3:4</option><option>4:3</option><option>4:5</option><option>5:4</option><option>9:16</option><option>16:9</option><option>21:9</option>
        </select></label>
      </div>
      <form id="composer" autocomplete="off">
        <button id="attachBtn" type="button" class="icon round" aria-label="Attach image or PDF" title="Attach image or PDF"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <input id="fileInput" type="file" accept="image/*,application/pdf" multiple class="hidden" />
        <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
        <button id="send" type="submit" class="primary round" aria-label="Send" title="Send" disabled><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
        <button id="stop" type="button" class="round stop hidden" aria-label="Stop" title="Stop"><svg class="ic" aria-hidden="true"><use href="#i-stop"/></svg></button>
      </form>
      <div id="hint"></div>
    </div>
  </main>
</div>

<div id="toast" role="status" class="hidden"></div>

<dialog id="modelDlg" class="sheet">
  <div class="sheet-head">
    <div class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input id="modelSearch" type="search" placeholder="Search models" autocomplete="off" aria-label="Search models" /></div>
    <button type="button" class="icon" data-close aria-label="Close" title="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <div class="chips" id="modelFilters">
    <button type="button" data-f="all" class="chip on">All</button>
    <button type="button" data-f="vision" class="chip"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg>Vision</button>
    <button type="button" data-f="image" class="chip"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg>Makes images</button>
    <button type="button" data-f="reason" class="chip"><svg class="ic" aria-hidden="true"><use href="#i-brain"/></svg>Reasoning</button>
    <button type="button" data-f="free" class="chip">Free</button>
  </div>
  <div id="modelList"></div>
</dialog>

<dialog id="settings" class="sheet">
  <div class="sheet-head"><h2>Settings</h2>
  <button type="button" class="icon" data-close aria-label="Close" title="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="settings-body">
    <label>Hack Club AI API key
      <input id="apiKey" type="password" placeholder="from ai.hackclub.com/dashboard" autocomplete="off" spellcheck="false" />
    </label>
    <label class="check"><input id="rememberKey" type="checkbox" /> Remember key on this device</label>
    <small>Unticked: the key is kept only until you close this tab.</small>
    <label>API base URL (your Worker relay)
      <input id="baseUrl" type="url" placeholder="https://your-worker.workers.dev/proxy/v1" spellcheck="false" />
      <small>Hack Club only allows browser calls from its own sites, so this must be your Cloudflare Worker (see README).</small>
    </label>
    <label>System prompt
      <textarea id="systemPrompt" rows="3" placeholder="You are a helpful assistant."></textarea>
    </label>
    <div class="grid2">
      <label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.1" placeholder="default" inputmode="decimal" /></label>
      <label>Max tokens <input id="maxTokens" type="number" min="1" step="1" placeholder="default" inputmode="numeric" /></label>
    </div>
    <label>Theme
      <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </label>
    <label class="check"><input id="wakeLock" type="checkbox" /> Keep screen awake while a reply is generating</label>
    <div class="row">
      <button type="button" id="saveSettings" class="primary">Save</button>
      <button type="button" id="showStats">Usage</button>
    </div>
    <div id="statsOut" class="muted"></div>
    <h3>Your chats</h3>
    <div class="row">
      <button type="button" id="exportBtn">Export</button>
      <button type="button" id="importBtn">Import</button>
      <input id="importFile" type="file" accept="application/json,.json" class="hidden" />
      <button type="button" id="clearAll" class="danger">Delete all</button>
    </div>
    <small id="storageInfo" class="muted"></small>
  </div>
</dialog>

<dialog id="viewer" class="viewer">
  <img id="viewerImg" alt="" />
  <div class="row">
    <button type="button" id="viewerDownload"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg><span>Download</span></button>
    <button type="button" id="viewerEdit"><svg class="ic" aria-hidden="true"><use href="#i-wand"/></svg><span>Edit with AI</span></button>
    <button type="button" data-close>Close</button>
  </div>
</dialog>
</body>
</html>
