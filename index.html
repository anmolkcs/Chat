<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chat · Hack Club AI</title>
<meta name="theme-color" content="#0f1115" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <button id="newChat" class="primary">＋ New chat</button>
    <div id="chatList"></div>
    <button id="openSettings" class="ghost">⚙ Settings</button>
  </aside>

  <main>
    <header>
      <button id="toggleSidebar" class="icon" aria-label="Menu">☰</button>
      <select id="model" title="Model"></select>
      <span id="status"></span>
    </header>

    <section id="messages">
      <div id="empty">
        <h1>Hack Club AI Chat</h1>
        <p>Pick a model and say hi. Your API key and chats stay in this browser.</p>
      </div>
    </section>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message…" autocomplete="off"></textarea>
      <button id="send" type="submit" class="primary" aria-label="Send">➤</button>
      <button id="stop" type="button" class="danger hidden" aria-label="Stop">■</button>
    </form>
  </main>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <label>Hack Club AI API key
      <input id="apiKey" type="password" placeholder="from ai.hackclub.com/dashboard" autocomplete="off" />
    </label>
    <label>API base URL
      <input id="baseUrl" type="url" placeholder="https://your-worker.workers.dev/proxy/v1" />
      <small>Hack Club only allows browser calls from its own sites, so point this at your Cloudflare Worker relay (see README).</small>
    </label>
    <label>System prompt
      <textarea id="systemPrompt" rows="3" placeholder="You are a helpful assistant."></textarea>
    </label>
    <div class="row">
      <button type="button" id="clearAll" class="danger">Delete all chats</button>
      <button value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
